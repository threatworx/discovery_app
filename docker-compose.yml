services:
    discovery_app:
        image: threatworx/discovery_app:latest
        container_name: threatworx_discovery_app
        # Host networking so passive discovery can listen on the host's
        # SPAN / mirror / TAP interfaces. The app is served directly on
        # the host's port 443 (port mappings don't apply in host mode).
        network_mode: host
        volumes:
            - ./config:/opt/discovery_app/config
        restart: always
        pull_policy: always
    watchtower:
        image: containrrr/watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        command: --interval 86400 --cleanup --remove-volumes --debug threatworx_discovery_app
        depends_on: 
            - discovery_app
